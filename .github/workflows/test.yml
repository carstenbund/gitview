name: Test on Multiple Platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Verify installation
      run: |
        python -m gitview.cli --version
        python verify_installation.py

    - name: Run unit tests
      # The GraphQL integration class talks to the live GitHub API and needs a token.
      run: |
        python -m pytest -q --deselect tests/test_github_graphql.py::TestGitHubGraphQLIntegration

    - name: Test basic functionality
      run: |
        python -m gitview.cli --help
        python -m gitview.cli analyze --help
        python -m gitview.cli graph --help
